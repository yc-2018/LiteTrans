name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建或更新的发行版标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build LiteTrans
        shell: cmd
        run: call build.cmd

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'LiteTrans.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'build.cmd 没有生成 LiteTrans.exe'
          }

          $file = Get-Item -LiteralPath $exe
          if ($file.Length -lt 10KB) {
            throw "LiteTrans.exe 文件异常（$($file.Length) bytes）"
          }

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = $env:REF_NAME.Trim()
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "发行版标签必须使用 v主版本.次版本.修订版本 格式，例如 v1.0.0；当前值：$tag"
          }

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if (git tag --list $tag) {
              $existing = (git rev-parse "refs/tags/$tag^{commit}").Trim()
              if ($existing -ne $env:CURRENT_SHA) {
                throw "标签 $tag 已经指向另一个提交；请从该标签触发工作流，或换一个新标签。"
              }
            }
          }

          $version = $tag.Substring(1)
          $assetName = "LiteTrans.exe"
          $checksumName = "LiteTrans-$tag-SHA256SUMS.txt"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "checksum_name=$checksumName" >> $env:GITHUB_OUTPUT

      - name: Prepare release files
        id: package
        shell: pwsh
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
          CHECKSUM_NAME: ${{ steps.metadata.outputs.checksum_name }}
        run: |
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET_NAME
          $checksum = Join-Path $env:GITHUB_WORKSPACE $env:CHECKSUM_NAME

          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -LiteralPath $checksum -Encoding utf8NoBOM

          "asset=$asset" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteTrans-${{ steps.metadata.outputs.tag }}-windows
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $tags = @(gh release list --limit 200 --json tagName --jq '.[].tagName')
          if ($tags -contains $env:RELEASE_TAG) {
            $oldZips = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name' | Where-Object { $_ -like '*.zip' })
            foreach ($name in $oldZips) {
              gh release delete-asset $env:RELEASE_TAG $name --yes
            }
            gh release upload $env:RELEASE_TAG $env:ASSET $env:CHECKSUM --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:ASSET $env:CHECKSUM `
              --target $env:COMMIT_SHA `
              --title "LiteTrans $env:RELEASE_TAG" `
              --generate-notes
          }
